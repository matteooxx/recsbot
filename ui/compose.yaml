services:
  ui:
    build:
      context: .
    image: recsbot-ui:local
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - ./runtime/app.env
    environment:
      APP_ENV_PATH: /data/app.env
    ports:
      - "${RECSBOT_UI_BIND_ADDRESS:-127.0.0.1}:${RECSBOT_UI_PORT:-5001}:5001"
    volumes:
      - ./runtime:/data:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
