<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>recsbot — Accedi</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" href="/static/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/intertight-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-page">
<div class="auth-bg" aria-hidden="true"></div>

<main class="auth-card" role="main">
  <header class="auth-header">
    <div class="auth-mark" aria-hidden="true">🎯</div>
    <h1 class="auth-title">recs<em>bot</em></h1>
    <p class="auth-subtitle">Cosa giochiamo o guardiamo stasera?</p>
  </header>
  <div class="auth-form">
    <div class="auth-error" id="loginError" role="alert"></div>
    <div class="auth-info" id="loginInfo" role="status"></div>
    <div class="auth-field">
      <label class="auth-label" for="username">Username</label>
      <input class="auth-input" type="text" id="username" placeholder="admin" autocomplete="username" autofocus>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-btn" id="loginBtn" type="button" onclick="doLogin()">Accedi</button>
    <button class="auth-link" id="forgotBtn" onclick="doForgot()" type="button">Password dimenticata?</button>
  </div>
  <footer class="auth-footer">Accesso riservato · Solo admin</footer>
</main>
<script>
document.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
function doLogin(){
  var u=document.getElementById("username").value.trim();
  var p=document.getElementById("password").value;
  var btn=document.getElementById("loginBtn");
  var err=document.getElementById("loginError");
  if(!u||!p){err.textContent="Inserisci username e password.";err.classList.add("visible");return;}
  btn.disabled=true; btn.innerHTML='<span class="auth-spinner"></span>Accesso...';
  err.classList.remove("visible");
  fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){window.location.href="/";}
      else{err.textContent=d.error||"Credenziali non valide.";err.classList.add("visible");btn.disabled=false;btn.textContent="Accedi";}
    }).catch(()=>{err.textContent="Errore di connessione.";err.classList.add("visible");btn.disabled=false;btn.textContent="Accedi";});
}
function doForgot(){
  var btn=document.getElementById("forgotBtn"), info=document.getElementById("loginInfo"), err=document.getElementById("loginError");
  err.classList.remove("visible");
  btn.disabled=true; btn.textContent="Invio in corso...";
  fetch("/api/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
    .then(()=>{info.textContent="Se l'email è configurata, riceverai un link di reset.";info.classList.add("visible");btn.textContent="Email inviata";})
    .catch(()=>{err.textContent="Errore di connessione.";err.classList.add("visible");btn.disabled=false;btn.textContent="Password dimenticata?";});
}
</script>
</body>
</html>
