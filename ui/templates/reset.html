<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>recsbot — Reset password</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" href="/static/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/intertight-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-page">
<div class="auth-bg" aria-hidden="true"></div>

<main class="auth-card" role="main">
  <header class="auth-header">
    <div class="auth-mark" aria-hidden="true">🔑</div>
    <h1 class="auth-title">Reset <em>password</em></h1>
    <p class="auth-subtitle">Imposta una nuova password admin</p>
  </header>
  <div class="auth-form">
    <div class="auth-error" id="resetError" role="alert"></div>
    <div class="auth-info" id="resetInfo" role="status"></div>
    <div class="auth-field">
      <label class="auth-label" for="newPass">Nuova password</label>
      <input class="auth-input" type="password" id="newPass" autocomplete="new-password" autofocus>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="confirmPass">Conferma password</label>
      <input class="auth-input" type="password" id="confirmPass" autocomplete="new-password">
    </div>
    <button class="auth-btn" id="resetBtn" type="button" onclick="doReset()">Reimposta password</button>
  </div>
  <footer class="auth-footer">Il link è valido una volta sola.</footer>
</main>
<script>
function getToken(){return new URLSearchParams(window.location.search).get("token")||"";}
document.addEventListener("keydown",e=>{if(e.key==="Enter")doReset();});
if(!getToken()){document.getElementById("resetError").textContent="Token mancante.";document.getElementById("resetError").classList.add("visible");document.getElementById("resetBtn").disabled=true;}
function doReset(){
  var t=getToken(), p1=document.getElementById("newPass").value, p2=document.getElementById("confirmPass").value;
  var btn=document.getElementById("resetBtn"), err=document.getElementById("resetError"), info=document.getElementById("resetInfo");
  err.classList.remove("visible"); info.classList.remove("visible");
  if(!p1||!p2){err.textContent="Compila entrambi i campi.";err.classList.add("visible");return;}
  if(p1!==p2){err.textContent="Le password non coincidono.";err.classList.add("visible");return;}
  if(p1.length<8){err.textContent="Almeno 8 caratteri.";err.classList.add("visible");return;}
  btn.disabled=true; btn.innerHTML='<span class="auth-spinner"></span>Reset...';
  fetch("/api/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t,new:p1})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){info.textContent="Password reimpostata. Reindirizzamento...";info.classList.add("visible");setTimeout(()=>{window.location.href="/";},2000);}
      else{err.textContent=d.error||"Errore.";err.classList.add("visible");btn.disabled=false;btn.textContent="Reimposta password";}
    }).catch(()=>{err.textContent="Errore di connessione.";err.classList.add("visible");btn.disabled=false;btn.textContent="Reimposta password";});
}
</script>
</body>
</html>
