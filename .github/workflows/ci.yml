name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Audit dependencies
        run: |
          python -m pip_audit -r requirements.txt --progress-spinner off
          python -m pip_audit -r requirements-local.txt --progress-spinner off

  backend-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --tag recsbot-backend:ci backend

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ui/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
      - name: Run checks
        run: make check
      - name: Validate the Compose file
        run: |
          # compose.yaml reads runtime/app.env, which is generated by
          # scripts/init-local-env.py and never committed. An empty file is
          # enough for the parser and keeps no secret in the workflow.
          mkdir -p runtime
          : > runtime/app.env
          docker compose config --quiet
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  ui-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build UI image
        run: docker build --tag recsbot-ui:ci ui
